openapi: 3.0.3
info:
  title: BrewMesh API
  version: 0.1.0
  description: >-
    OpenAPI specification for BrewMesh, the AI-powered connected cafe companion.
    Provides customer ordering, menu exploration, Gemini-powered Omni-Search, Table Connect
    social discovery and messaging, room vibe sentiment feedback, and owner/barista operations.
servers:
  - url: /
    description: Current host server
paths:
  /api/me:
    get:
      summary: Retrieve current viewer profile and cafe context
      description: Retrieve the active user profile, INR wallet balance, active orders with live wait times, past order history (usuals), incoming Table Connect waves, and discoverability status.
      operationId: GetViewerContext
      tags:
        - MCP
        - Customer
      x-mcp-description: Retrieve the active user profile, INR wallet balance, active orders with live wait times, past order history (usuals), incoming Table Connect waves, and discoverability status. Call this tool first when you need to check a user wallet balance, usual coffee preferences, or current Table Connect status.
      x-mcp-annotations:
        readOnlyHint: true
        openWorldHint: false
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
            default: syed
          description: User handle to inspect, for example syed, ananya, kabir, zoya, or owner.
      responses:
        '200':
          description: Active viewer profile and current cafe context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerContext'
        '404':
          description: User profile not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/menu:
    get:
      summary: List cafe menu items with live stock and customizations
      description: List or filter the BrewMesh cafe menu across Coffee, Tea & Coolers, Burgers & Sandwiches, and Chips & Sides. Returns base prices in INR, live stock counts, prep times, sensory tags, and available customization groups.
      operationId: ListMenuItems
      tags:
        - MCP
        - Customer
      x-mcp-description: List or filter the BrewMesh cafe menu across Coffee, Tea & Coolers, Burgers & Sandwiches, and Chips & Sides. Returns base prices in INR, live stock counts, prep times, sensory tags, and available customization groups (such as Milk type, Spice level, Bun/Bread choice, Seasoning, and Dips).
      x-mcp-annotations:
        readOnlyHint: true
        openWorldHint: false
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - Coffee
              - Tea & Coolers
              - Burgers & Sandwiches
              - Chips & Sides
          description: Menu category to filter by.
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: Search keyword matching item names, descriptions, or sensory tags.
        - name: onlyAvailable
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only items currently in stock and available for ordering.
      responses:
        '200':
          description: Filtered list of cafe menu items.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/MenuItem'

  /api/omni-search:
    post:
      summary: Run Gemini-powered Omni-Search and Cafe Companion
      description: Run the Gemini-powered BrewMesh Omni-Search and Cafe Companion. Use this tool when a user is confused about what to order, describes a physical condition or mood, asks for pairings under a budget, or expresses an intent to become discoverable on Table Connect.
      operationId: OmniSearchCafe
      tags:
        - MCP
        - Customer
      x-mcp-description: Run the Gemini-powered BrewMesh Omni-Search and Cafe Companion. Use this tool when a user is confused about what to order, describes a physical condition or mood (for example, sleep-deprived, rainy day, sensitive stomach), asks for pairings under a budget, or expresses an intent to become discoverable on Table Connect (for example, stating what assignment or project they are working on and wanting to meet people). Returns tailored menu recommendations with pre-selected customizations, matching people in the cafe, and any actions taken.
      x-mcp-annotations:
        readOnlyHint: false
        idempotentHint: false
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - query
              properties:
                userId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle issuing the query.
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Natural-language query, mood, condition, menu search, Table Connect opt-in blurb, or owner analytics question.
                autoExecuteTools:
                  type: boolean
                  default: true
                  description: When true, allows the Gemini companion to automatically execute safe status updates such as setting Table Connect discoverability when the user states they want to be discoverable.
      responses:
        '200':
          description: Omni-search AI overview, recommendations, and actions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniSearchResponse'
        '400':
          description: Invalid search query or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders:
    post:
      summary: Place a customized food and drink order
      description: Place a customized food and drink order for a user and pay automatically from their INR wallet. Validates item stock, calculates customization add-ons, deducts the total from the user wallet, and queues the order for the barista kitchen screen.
      operationId: PlaceOrder
      tags:
        - MCP
        - Customer
      x-mcp-description: Place a customized food and drink order for a user and pay automatically from their INR wallet. Validates item stock, calculates customization add-ons, deducts the total from the user wallet, and queues the order for the barista kitchen screen. If the order fails due to insufficient wallet balance, call top_up_wallet to add 2000 INR and retry. If the response includes a companionNudge field, ask the user if they want to become discoverable on Table Connect and share what they are working on or thinking about.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
              properties:
                userId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle placing the order.
                orderedVia:
                  type: string
                  enum:
                    - web_ui
                    - webmcp_agent
                    - mcp_server
                  default: web_ui
                  description: Interface that placed the order.
                notes:
                  type: string
                  maxLength: 200
                  description: Optional preparation notes or special instructions for the barista.
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: Array of menu items with quantities and customizations.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - menuItemId
                      - quantity
                    properties:
                      menuItemId:
                        type: integer
                        minimum: 1
                        maximum: 1000
                        description: Unique identifier of the menu item.
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 20
                        description: Quantity of this item to order.
                      customizations:
                        type: object
                        additionalProperties:
                          type: string
                          maxLength: 80
                        description: 'Key-value map of customization choices, for example {"Milk": "Oat Milk", "Spice Level": "Extra Gunpowder", "Dip": "Smoked Chipotle Mayo"}.'
      responses:
        '201':
          description: Order placed and queued for the barista kitchen screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          description: Invalid order items or out-of-stock ingredients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient wallet balance to complete order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/wallet/top-up:
    post:
      summary: Add funds to a customer wallet
      description: Add simulated INR funds (defaults to 2000 INR) to a user wallet.
      operationId: TopUpWallet
      tags:
        - MCP
        - Customer
      x-mcp-description: Add fake INR funds (defaults to 2000 INR) to a user wallet. Use this tool when the user clicks or asks to add money to their wallet, or when place_order reports an insufficient wallet balance.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                userId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle to credit.
                amount:
                  type: integer
                  minimum: 100
                  maximum: 10000
                  default: 2000
                  description: Amount in INR to credit to the user wallet. Defaults to 2000 INR.
      responses:
        '200':
          description: Wallet balance credited successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTopUpResponse'
        '400':
          description: Invalid top-up amount or user handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/table-connect:
    get:
      summary: Discover other people opted into Table Connect in the cafe
      description: Discover people in the cafe who have opted into Table Connect. Never filters or ranks people by whether they drink the same coffee, because different drinks let people teach each other about flavor notes. Instead, surfaces their optional blurb, table location, what they are currently sipping, and Gemini-crafted conversation starters.
      operationId: DiscoverTableConnect
      tags:
        - MCP
        - Social
      x-mcp-description: Discover people in the cafe who have opted into Table Connect. Never filters or ranks people by whether they drink the same coffee, because different drinks let people teach each other about flavor notes. Instead, surfaces their optional blurb (what they are working on or thinking about), their table, what they are currently sipping, and Gemini-crafted conversation starters.
      x-mcp-annotations:
        readOnlyHint: true
        openWorldHint: false
      parameters:
        - name: viewerId
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
            default: syed
          description: Viewer user handle requesting discoverable profiles.
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Optional topic, interest, or keyword to filter discoverable people or generate tailored conversation starters.
      responses:
        '200':
          description: Active discoverable people in the cafe.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/TableConnectPerson'
    put:
      summary: Update Table Connect discoverability and status blurb
      description: Opt a user in or out of Table Connect discoverability in the cafe and save their optional status blurb about what they are doing, working on, or thinking about.
      operationId: UpdateTableConnect
      tags:
        - MCP
        - Social
      x-mcp-description: Opt a user in or out of Table Connect discoverability in the cafe and save their optional status blurb about what they are doing, working on, or thinking about. Use this whenever a user says they want to be discoverable or wants to share what they are up to so others in the cafe can meet them.
      x-mcp-annotations:
        idempotentHint: true
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - isDiscoverable
              properties:
                userId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle to update.
                isDiscoverable:
                  type: boolean
                  description: Set to true to make the user visible to others in the cafe on Table Connect, or false to hide them.
                tableLabel:
                  type: string
                  maxLength: 40
                  description: Table or seat location in the cafe, for example Table 4 or Window Seat 2.
                statusBlurb:
                  type: string
                  maxLength: 280
                  description: Optional blurb sharing what the user is working on, doing, or thinking about (for example, "Working on a material science assignment for my company, open to meet people here!").
      responses:
        '200':
          description: Table Connect profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableConnectProfile'
        '400':
          description: Invalid parameters or user handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/table-connect/wave:
    post:
      summary: Send an icebreaker wave and note to another table
      description: Send a live wave and icebreaker note to another discoverable person in the cafe. Delivered immediately to their screen over PGMB Server-Sent Events.
      operationId: SendTableWave
      tags:
        - MCP
        - Social
      x-mcp-description: Send a live wave and icebreaker note to another discoverable person in the cafe. Delivered immediately to their screen over PGMB Server-Sent Events.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - toUserId
                - message
              properties:
                fromUserId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle sending the wave.
                toUserId:
                  type: string
                  maxLength: 40
                  description: Recipient user handle at another table.
                message:
                  type: string
                  minLength: 1
                  maxLength: 280
                  description: Friendly greeting or conversation starter to send to the person table.
      responses:
        '201':
          description: Table wave sent and broadcast via PGMB Server-Sent Events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableWaveReceipt'
        '400':
          description: Invalid recipient or message length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/room-vibes:
    post:
      summary: Submit room atmosphere and vibe sentiment feedback
      description: Submit live feedback or room vibe sentiment (Understand the Room) to help the cafe team respond to temperature, music, seating, or service needs.
      operationId: SubmitRoomVibe
      tags:
        - MCP
        - Customer
      x-mcp-description: Submit live feedback or room vibe sentiment (Understand the Room) to help the cafe team respond to temperature, music, seating, or service needs.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - vibe
                - comment
              properties:
                userId:
                  type: string
                  maxLength: 40
                  default: syed
                  description: User handle submitting the feedback.
                vibe:
                  type: string
                  enum:
                    - Amazing
                    - Cozy
                    - Productive
                    - Too Cold
                    - Noisy
                  description: Vibe sentiment category.
                comment:
                  type: string
                  minLength: 1
                  maxLength: 280
                  description: Feedback about the cafe atmosphere, music, temperature, or food.
      responses:
        '201':
          description: Room vibe recorded and broadcast to the owner dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomVibeRecord'
        '400':
          description: Invalid vibe category or empty comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/owner/dashboard:
    get:
      summary: Retrieve owner and barista operational dashboard
      description: Retrieve the complete Owner and Barista operational dashboard, including the live Kitchen Order Queue (Pending, Preparing, Ready), full menu inventory stock counts, revenue and Agent-vs-Human analytics, and live Room Vibe feedback.
      operationId: GetOwnerDashboard
      tags:
        - MCP
        - Owner
      x-mcp-description: Retrieve the complete Owner and Barista operational dashboard, including the live Kitchen Order Queue (Pending, Preparing, Ready), full menu inventory stock counts, revenue and Agent-vs-Human analytics, and live Room Vibe feedback.
      x-mcp-annotations:
        readOnlyHint: true
        openWorldHint: false
      parameters:
        - name: quarter
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
          description: Optional financial quarter filter, for example Q1-2026.
      responses:
        '200':
          description: Operational dashboard state with queue, inventory, analytics, and vibes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDashboard'
        '403':
          description: Unauthorized access to owner dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/owner/orders/{orderId}:
    patch:
      summary: Advance order status in the barista kitchen queue
      description: Update the preparation status of an order in the barista kitchen queue (Pending -> Preparing -> Ready -> Completed). Broadcasts the status change live to the customer and updates cafe wait-time predictions.
      operationId: AdvanceOrderStatus
      tags:
        - MCP
        - Owner
      x-mcp-description: Update the preparation status of an order in the barista kitchen queue (Pending -> Preparing -> Ready -> Completed). Broadcasts the status change live to the customer and updates cafe wait-time predictions.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Unique order identifier to advance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - Pending
                    - Preparing
                    - Ready
                    - Completed
                  description: New progress status for this order.
      responses:
        '200':
          description: Order status updated and broadcast live to customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdate'
        '400':
          description: Invalid status transition or missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/owner/menu/{itemId}:
    patch:
      summary: Update menu item stock levels or availability
      description: Update inventory stock levels or availability for a menu item in the cafe. Use this tool when the cafe owner or barista restocks ingredients or marks an item unavailable.
      operationId: UpdateMenuStock
      tags:
        - MCP
        - Owner
      x-mcp-description: Update inventory stock levels or availability for a menu item in the cafe. Use this tool when the cafe owner or barista restocks ingredients or marks an item unavailable.
      x-mcp-annotations:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Unique identifier of the menu item.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                stockDelta:
                  type: integer
                  minimum: -500
                  maximum: 500
                  description: Relative stock adjustment, for example +10 when restocking.
                absoluteStock:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: Exact new stock count.
                isAvailable:
                  type: boolean
                  description: Whether the item is currently available for ordering.
      responses:
        '200':
          description: Menu item inventory and availability updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Invalid stock count or delta value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Menu item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/owner/analytics:
    post:
      summary: Ask natural-language analytics questions for cafe owner
      description: Answer natural-language analytics and operational questions for the cafe owner using live Cloud SQL data and Gemini 2.5 Flash. Also summarizes Understand the Room customer sentiment into concrete action items for the cafe team.
      operationId: AskOwnerAnalytics
      tags:
        - MCP
        - Owner
      x-mcp-description: Answer natural-language analytics and operational questions for the cafe owner using live Cloud SQL data and Gemini 2.5 Flash. Also summarizes Understand the Room customer sentiment into concrete action items for the cafe team.
      x-mcp-annotations:
        readOnlyHint: true
        openWorldHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - question
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 400
                  description: Natural-language business, inventory, or room sentiment question from the cafe owner.
      responses:
        '200':
          description: Answer with key metrics and recommended action items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAnalyticsResponse'
        '400':
          description: Missing question in request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/events:
    get:
      summary: Subscribe to live cafe mutation events
      description: Subscribe to Server-Sent Events streamed by the PGMB event broker for live order status updates, table waves, and inventory notifications.
      operationId: GetEvents
      tags:
        - Events
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
            default: syed
          description: User handle subscribing to live events.
      responses:
        '200':
          description: Real-time SSE stream of cafe events.
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    ViewerContext:
      type: object
      additionalProperties: false
      required:
        - userId
        - name
        - role
        - walletBalance
        - isDiscoverable
        - usuals
        - activeOrders
        - incomingWaves
      properties:
        userId:
          type: string
          description: User handle.
        name:
          type: string
          description: Full display name.
        role:
          type: string
          enum:
            - customer
            - owner
          description: User permission role in the cafe system.
        walletBalance:
          type: integer
          minimum: 0
          description: Current wallet balance in INR.
        tableLabel:
          type: string
          nullable: true
          description: Table or seat identifier where the user is seated.
        isDiscoverable:
          type: boolean
          description: Whether the user is currently visible on Table Connect.
        statusBlurb:
          type: string
          nullable: true
          description: Status blurb sharing what the user is working on or thinking about.
        usuals:
          type: array
          maxItems: 20
          description: Frequent or favorite menu items ordered in past visits.
          items:
            $ref: '#/components/schemas/ViewerUsualItem'
        activeOrders:
          type: array
          maxItems: 20
          description: Active orders currently pending, preparing, or ready.
          items:
            $ref: '#/components/schemas/OrderReceipt'
        incomingWaves:
          type: array
          maxItems: 20
          description: Recent incoming Table Connect waves and icebreakers.
          items:
            $ref: '#/components/schemas/TableWaveReceipt'

    ViewerUsualItem:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - count
        - lastOrderedAt
      properties:
        menuItemId:
          type: integer
          description: Identifier of the menu item.
        name:
          type: string
          description: Name of the favorite menu item.
        count:
          type: integer
          minimum: 1
          description: Total times this item has been ordered by the user.
        lastOrderedAt:
          type: string
          description: ISO timestamp of the last order.

    MenuItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - category
        - description
        - price
        - stock
        - isAvailable
        - prepTimeMinutes
        - sensoryTags
        - imageUrl
        - customizations
      properties:
        id:
          type: integer
          description: Unique item identifier.
        name:
          type: string
          description: Name of the item.
        category:
          type: string
          enum:
            - Coffee
            - Tea & Coolers
            - Burgers & Sandwiches
            - Chips & Sides
          description: Menu category.
        description:
          type: string
          description: Item description with ingredients and tasting notes.
        price:
          type: integer
          minimum: 0
          description: Base price in INR.
        stock:
          type: integer
          minimum: 0
          description: Current available stock units.
        isAvailable:
          type: boolean
          description: Whether the item is available for ordering.
        prepTimeMinutes:
          type: integer
          minimum: 1
          description: Estimated barista preparation time in minutes.
        sensoryTags:
          type: array
          maxItems: 10
          description: Flavor, temperature, and mood tags.
          items:
            type: string
        imageUrl:
          type: string
          description: URL or asset path for item photography.
        customizations:
          type: array
          maxItems: 10
          description: Customization option groups.
          items:
            $ref: '#/components/schemas/CustomizationGroup'

    CustomizationGroup:
      type: object
      additionalProperties: false
      required:
        - name
        - required
        - options
      properties:
        name:
          type: string
          description: Customization group label, for example Milk, Spice Level, or Dip.
        required:
          type: boolean
          description: Whether selecting an option in this group is mandatory.
        options:
          type: array
          maxItems: 10
          description: Available choices within this customization group.
          items:
            $ref: '#/components/schemas/CustomizationOption'

    CustomizationOption:
      type: object
      additionalProperties: false
      required:
        - name
        - extraPrice
      properties:
        name:
          type: string
          description: Option label, for example Oat Milk, Extra Gunpowder, or Smoked Chipotle Mayo.
        extraPrice:
          type: integer
          minimum: 0
          description: Additional charge in INR for selecting this option.

    OmniSearchResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - menuRecommendations
        - tableMatches
        - actionsTaken
        - suggestedQueries
      properties:
        answer:
          type: string
          description: Gemini natural-language overview and reasoning.
        menuRecommendations:
          type: array
          maxItems: 10
          description: Curated menu recommendations tailored to the query.
          items:
            $ref: '#/components/schemas/OmniMenuRecommendation'
        tableMatches:
          type: array
          maxItems: 10
          description: Discoverable people in the cafe matching the interest or topic.
          items:
            $ref: '#/components/schemas/TableConnectPerson'
        actionsTaken:
          type: array
          maxItems: 10
          description: Status updates automatically performed during search.
          items:
            type: string
        suggestedQueries:
          type: array
          maxItems: 10
          description: Follow-up question prompts for the user.
          items:
            type: string

    OmniMenuRecommendation:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - price
        - rationale
        - matchScore
      properties:
        menuItemId:
          type: integer
          description: Identifier of the recommended menu item.
        name:
          type: string
          description: Item name.
        price:
          type: integer
          description: Base price in INR.
        rationale:
          type: string
          description: Why this item suits the user mood, budget, or condition.
        matchScore:
          type: number
          description: Relevance confidence score between 0.0 and 1.0.
        suggestedCustomizations:
          type: object
          additionalProperties:
            type: string
            maxLength: 80
          description: Pre-selected customizations recommended by the AI.

    OrderReceipt:
      type: object
      additionalProperties: false
      required:
        - orderId
        - userId
        - status
        - totalAmount
        - orderedVia
        - estimatedPrepMinutes
        - items
        - createdAt
      properties:
        orderId:
          type: integer
          description: Unique order identifier.
        userId:
          type: string
          description: User handle who placed the order.
        status:
          type: string
          enum:
            - Pending
            - Preparing
            - Ready
            - Completed
          description: Current preparation state in the kitchen.
        totalAmount:
          type: integer
          description: Total charged to the user wallet in INR.
        walletBalanceRemaining:
          type: integer
          nullable: true
          description: User wallet balance remaining after payment.
        orderedVia:
          type: string
          enum:
            - web_ui
            - webmcp_agent
            - mcp_server
          description: Interface origin of the order.
        notes:
          type: string
          nullable: true
          description: Barista preparation notes.
        estimatedPrepMinutes:
          type: integer
          description: Live estimated preparation wait time in minutes.
        companionNudge:
          type: string
          nullable: true
          description: Friendly nudge inviting the customer to opt into Table Connect while waiting.
        items:
          type: array
          maxItems: 20
          description: Line items included in this order.
          items:
            $ref: '#/components/schemas/OrderItemReceipt'
        createdAt:
          type: string
          description: ISO timestamp when the order was submitted.

    OrderItemReceipt:
      type: object
      additionalProperties: false
      required:
        - menuItemId
        - name
        - quantity
        - unitPrice
        - lineTotal
      properties:
        menuItemId:
          type: integer
          description: Menu item identifier.
        name:
          type: string
          description: Menu item name.
        quantity:
          type: integer
          minimum: 1
          description: Number of units prepared.
        unitPrice:
          type: integer
          description: Base unit price in INR.
        lineTotal:
          type: integer
          description: Total cost for this line item including customizations in INR.
        customizations:
          type: object
          additionalProperties:
            type: string
            maxLength: 80
          description: Chosen customization options for this item.

    WalletTopUpResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - creditedAmount
        - newWalletBalance
      properties:
        userId:
          type: string
          description: User handle whose wallet was credited.
        creditedAmount:
          type: integer
          description: INR amount credited in this transaction.
        newWalletBalance:
          type: integer
          description: New total wallet balance in INR.

    TableConnectProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - isDiscoverable
        - updatedAt
      properties:
        userId:
          type: string
          description: User handle.
        isDiscoverable:
          type: boolean
          description: Whether the user is discoverable by others in the cafe.
        tableLabel:
          type: string
          nullable: true
          description: Seating label in the cafe.
        statusBlurb:
          type: string
          nullable: true
          description: Blurb describing current project, study topic, or mood.
        updatedAt:
          type: string
          description: ISO timestamp of last update.

    TableConnectPerson:
      type: object
      additionalProperties: false
      required:
        - userId
        - name
        - tableLabel
        - conversationStarters
      properties:
        userId:
          type: string
          description: User handle.
        name:
          type: string
          description: Display name.
        tableLabel:
          type: string
          description: Table or seat location.
        statusBlurb:
          type: string
          nullable: true
          description: What they are working on, reading, or thinking about.
        currentOrder:
          type: string
          nullable: true
          description: Current coffee or snack they are enjoying.
        conversationStarters:
          type: array
          maxItems: 10
          description: AI-suggested icebreaker questions for meeting this person.
          items:
            type: string

    TableWaveReceipt:
      type: object
      additionalProperties: false
      required:
        - waveId
        - fromUserId
        - toUserId
        - message
        - status
        - createdAt
      properties:
        waveId:
          type: integer
          description: Unique wave identifier.
        fromUserId:
          type: string
          description: Sender user handle.
        toUserId:
          type: string
          description: Recipient user handle.
        message:
          type: string
          description: Friendly greeting or icebreaker note.
        status:
          type: string
          description: Delivery status.
        createdAt:
          type: string
          description: ISO timestamp when the wave was sent.

    RoomVibeRecord:
      type: object
      additionalProperties: false
      required:
        - vibeId
        - userId
        - vibe
        - comment
        - createdAt
      properties:
        vibeId:
          type: integer
          description: Unique room vibe identifier.
        userId:
          type: string
          description: User handle who submitted feedback.
        vibe:
          type: string
          enum:
            - Amazing
            - Cozy
            - Productive
            - Too Cold
            - Noisy
          description: Atmosphere category.
        comment:
          type: string
          description: Atmosphere or cafe feedback note.
        createdAt:
          type: string
          description: ISO timestamp of submission.

    OwnerDashboard:
      type: object
      additionalProperties: false
      required:
        - kitchenQueue
        - inventory
        - analytics
        - roomVibes
      properties:
        kitchenQueue:
          type: array
          maxItems: 100
          description: Active orders currently pending, preparing, or ready.
          items:
            $ref: '#/components/schemas/OrderReceipt'
        inventory:
          type: array
          maxItems: 100
          description: Menu item stock counts and availability flags.
          items:
            $ref: '#/components/schemas/MenuItem'
        analytics:
          $ref: '#/components/schemas/OwnerAnalyticsSummary'
        roomVibes:
          type: array
          maxItems: 100
          description: Recent customer room vibe submissions.
          items:
            $ref: '#/components/schemas/RoomVibeRecord'

    OwnerAnalyticsSummary:
      type: object
      additionalProperties: false
      required:
        - revenueToday
        - totalOrders
        - humanOrdersCount
        - agentOrdersCount
        - agentRevenueRatio
      properties:
        revenueToday:
          type: integer
          description: Total revenue earned today in INR.
        totalOrders:
          type: integer
          description: Total number of orders placed today.
        humanOrdersCount:
          type: integer
          description: Orders placed by humans via the web UI.
        agentOrdersCount:
          type: integer
          description: Orders placed autonomously by AI agents (WebMCP / MCP).
        agentRevenueRatio:
          type: number
          description: Ratio of revenue driven by AI agents vs total revenue (0.0 to 1.0).

    OrderStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - orderId
        - status
        - updatedAt
      properties:
        orderId:
          type: integer
          description: Order identifier.
        status:
          type: string
          enum:
            - Pending
            - Preparing
            - Ready
            - Completed
          description: New order status.
        updatedAt:
          type: string
          description: ISO timestamp when the status was updated.

    OwnerAnalyticsResponse:
      type: object
      additionalProperties: false
      required:
        - question
        - answer
        - keyMetrics
        - actionItems
      properties:
        question:
          type: string
          description: The question asked by the owner.
        answer:
          type: string
          description: Gemini-generated business and operational analysis.
        keyMetrics:
          $ref: '#/components/schemas/OwnerAnalyticsKeyMetrics'
        actionItems:
          type: array
          maxItems: 10
          description: Recommended actionable steps for the cafe team.
          items:
            type: string

    OwnerAnalyticsKeyMetrics:
      type: object
      additionalProperties: false
      required:
        - revenueToday
        - activeOrders
        - lowStockItems
        - dominantRoomVibe
      properties:
        revenueToday:
          type: integer
          description: Total revenue generated today in INR.
        activeOrders:
          type: integer
          description: Current count of incomplete orders in the kitchen.
        lowStockItems:
          type: integer
          description: Number of menu items with stock below threshold.
        dominantRoomVibe:
          type: string
          description: Prevailing customer sentiment in the cafe.

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error explanation.
        code:
          type: string
          description: Error classification code.
        details:
          type: object
          additionalProperties: true
          description: Supplementary error details or validation issues.
